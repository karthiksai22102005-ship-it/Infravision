name: infravision_camera
description: Windows webcam camera plugin for InfraVision using Media Foundation.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: InfravisionCameraPlugin