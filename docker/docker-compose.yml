version: '3.8'

services:
  infravision-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infravision-ai-engine
    ports:
      - "8000:8000"
    volumes:
      - ../assets/models:/app/exported_models
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
