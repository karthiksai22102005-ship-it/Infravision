name: citizen_app
description: InfraVision Citizen - report potholes and civic issues.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  camera: ^0.11.0
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  open_filex: ^4.4.0
  uuid: ^4.4.0
  image: ^4.2.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/city_road_sunrise.png
    - assets/images/app_icon.png
    - assets/models/citizen_damage_yolov8n.tflite
