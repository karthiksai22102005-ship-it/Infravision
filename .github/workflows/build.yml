name: Build InfraVision APK

# Runs automatically on every push to main, and can be triggered manually
# from the Actions tab. This is the free build server that replaces a
# local Android/Flutter toolchain.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Analyze, test, and build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Report APK size
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: infravision-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
